name: iOS build and test

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - ".github/scripts/xcresult-summary.py"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - ".github/scripts/xcresult-summary.py"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and XCTest (Xcode 26)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT: ios/WePark/WePark.xcodeproj
      SCHEME: WePark
      # Everything lives inside the workspace (never an iCloud-synced path).
      DERIVED: ${{ github.workspace }}/.ci/DerivedData
      SPM: ${{ github.workspace }}/.ci/SourcePackages
      RESULTS: ${{ github.workspace }}/.ci/results
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          # Newest Xcode 26.x installed on the image.
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 found on this runner image; the project requires Xcode 26."
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Generate dummy Config.xcconfig
        run: |
          set -euo pipefail
          # Real tokens are never used in CI. The file is gitignored, so it
          # must be generated; values are dummies.
          # (xcconfig treats // as a comment, hence the $() trick in the URL.)
          cat > ios/WePark/Config.xcconfig <<'CFG'
          MAPBOX_ACCESS_TOKEN = pk.ci-dummy-token
          SUPABASE_URL = https:/$()/ci-dummy.supabase.co
          SUPABASE_ANON_KEY = ci-dummy-anon-key
          CFG
          cat ios/WePark/Config.xcconfig

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .ci/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/WePark/WePark.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve simulator
        id: sim
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess
          def sh(*a):
              return subprocess.run(a, check=True, capture_output=True, text=True).stdout
          rts = json.loads(sh("xcrun", "simctl", "list", "runtimes", "available", "-j"))["runtimes"]
          ios = [r for r in rts if ".iOS-" in r["identifier"]]
          if not ios:
              raise SystemExit("no available iOS simulator runtime")
          ver = lambda r: tuple(int(x) for x in re.findall(r"\d+", r["version"]))
          rt = sorted(ios, key=ver)[-1]
          devs = json.loads(sh("xcrun", "simctl", "list", "devices", "available", "-j"))["devices"].get(rt["identifier"], [])
          phones = [d for d in devs if d["name"].startswith("iPhone") and "SE" not in d["name"]]
          pick = next((d for d in phones if d["name"] == "iPhone 17"), None) or (phones[-1] if phones else None)
          if pick is None:
              types = json.loads(sh("xcrun", "simctl", "list", "devicetypes", "-j"))["devicetypes"]
              t = [x for x in types if x["name"].startswith("iPhone")][-1]
              udid = sh("xcrun", "simctl", "create", "wepark-ci", t["identifier"], rt["identifier"]).strip()
              name = t["name"]
          else:
              udid, name = pick["udid"], pick["name"]
          print(f"udid={udid}")
          print(f"name={name}")
          print(f"runtime={rt['name']}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Start simulator boot (overlaps with the build)
        run: |
          # First boot on a fresh runner takes ~8 min (data migration); kick it
          # off now and only wait for it right before the tests run.
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true

      - name: Build for testing
        run: |
          set -euo pipefail
          rm -rf "$RESULTS/build.xcresult"
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            -clonedSourcePackagesDirPath "$SPM" \
            -resultBundlePath "$RESULTS/build.xcresult" \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RESULTS/build.log"

      - name: Test
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          rm -rf "$RESULTS/test.xcresult"
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath "$RESULTS/test.xcresult" \
            -parallel-testing-enabled NO \
            2>&1 | tee "$RESULTS/test.log"

      - name: Job summary
        if: always()
        run: |
          set -uo pipefail
          {
            python3 .github/scripts/xcresult-summary.py \
              "build=$RESULTS/build.xcresult" "test=$RESULTS/test.xcresult" || true
            echo
            echo "### Raw error lines"
            echo '```'
            grep -hE "error:|\*\* (BUILD|TEST) (FAILED|SUCCEEDED)|Test [Cc]ase .* failed" \
              "$RESULTS/build.log" "$RESULTS/test.log" 2>/dev/null | sort -u | head -n 100
            grep -h "Executed [0-9]* tests" "$RESULTS/test.log" 2>/dev/null | tail -n 1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload result bundles and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: .ci/results
          if-no-files-found: warn
          retention-days: 14
