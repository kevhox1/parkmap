<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid #241f45;border-radius:30px 30px 0 0;padding:20px 18px 36px;color:#241f45;font-family:'Fredoka',sans-serif">
<div style="position:absolute;left:14px;right:14px;bottom:100%;margin-bottom:12px;display:flex;gap:8px"><div style="flex:1;height:48px;padding:0 16px;display:flex;align-items:center;background:#fff;border:1.5px solid #241f45;border-radius:24px;font:500 15px 'Fredoka',sans-serif;color:#5a5578">Search an address</div><div style="width:48px;height:48px;box-sizing:border-box;border-radius:50%;background:#fff;border:1.5px solid #241f45;display:flex;align-items:center;justify-content:center;font:600 11px 'Fredoka',sans-serif">More</div><div style="width:48px;height:48px;box-sizing:border-box;border-radius:50%;background:#fff;border:1.5px solid #241f45;display:flex;align-items:center;justify-content:center;font:600 11px 'Fredoka',sans-serif">Locate</div></div>
<div style="padding:0 4px"><div style="font:500 13px 'Fredoka',sans-serif">{{ lead }}</div><div style="display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:40px"><div style="font:600 34px/1.1 'Fredoka',sans-serif;white-space:nowrap">{{ end }}</div><sc-if value="{{ lever }}" hint-placeholder-val="{{ false }}"><div style="flex:none;height:48px;margin:-6px 0;padding:0 12px;box-sizing:border-box;display:flex;align-items:center;border:2.5px solid #241f45;border-radius:24px;font:600 15px 'Fredoka',sans-serif">Change</div></sc-if></div><div style="font:400 13px 'Fredoka',sans-serif;margin-top:2px">{{ sub }}</div></div>
<sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}"><div style="margin:10px 4px 0;font:500 14px/1.35 'Fredoka',sans-serif">{{ note }}</div></sc-if>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;text-align:center"><sc-for list="{{ tiles }}" as="t" hint-placeholder-count="3"><div style="{{ t.style }}"><div style="font:600 15px 'Fredoka',sans-serif">{{ t.name }}</div><div style="font:400 13px 'Fredoka',sans-serif;margin-top:3px">{{ t.until }}</div></div></sc-for></div>
<div style="height:64px;margin-top:16px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#241f45;color:#ffd23f;border-radius:32px;font:600 22px 'Fredoka',sans-serif">{{ cta }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:812},&quot;goal&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Green curbs are free from now until&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;end&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;7 AM tomorrow&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;8 h 49 min from now&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;u0&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;until 1:11 AM&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;u1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;until 7 AM&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;u2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;until Wed 12/2&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lever&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Start driving&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const sel = p.goal ?? 1;
    const names = ['A few hours', 'Overnight', 'For days'];
    const u = [p.u0 ?? 'until 1:11 AM', p.u1 ?? 'until 7 AM', p.u2 ?? 'until Wed 12/2'];
    const base = { height: 76, boxSizing: 'border-box', borderRadius: 20, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' };
    const tiles = names.map((n, i) => ({ name: n, until: u[i], style: i === sel
      ? { ...base, border: '2.5px solid #241f45', background: '#ffd23f', boxShadow: '0 4px 0 #241f45', transform: 'translateY(-4px)' }
      : { ...base, border: '2px solid #241f45', background: '#fbf6e6' } }));
    return { lead: p.lead ?? 'Green curbs are free from now until', end: p.end ?? '7 AM tomorrow', sub: p.sub ?? '8 h 49 min from now', tiles, hasNote: !!p.note, note: p.note, lever: !!p.lever, cta: p.cta ?? 'Start driving' };
  }
}
</script>
</body>
</html>
