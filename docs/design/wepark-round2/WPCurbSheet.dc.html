<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid #241f45;border-radius:30px 30px 0 0;padding:18px 18px 36px;color:#241f45;font-family:'Fredoka',sans-serif">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div style="font:600 22px/1.2 'Fredoka',sans-serif">{{ street }}</div><div style="font:500 14px/1.3 'Fredoka',sans-serif;color:#5a5578">{{ cross }}</div></div><div style="flex:none;width:48px;height:48px;box-sizing:border-box;border-radius:50%;border:2.5px solid #241f45;display:flex;align-items:center;justify-content:center;font:600 12px 'Fredoka',sans-serif">Close</div></div>
<sc-if value="{{ plan }}" hint-placeholder-val="{{ false }}"><div style="display:inline-flex;align-items:center;height:28px;margin-top:10px;padding:0 10px;border-radius:14px;background:repeating-linear-gradient(135deg,#6a4cff 0 10px,#5a3df0 10px 20px);color:#fff;font:600 11px 'Fredoka',sans-serif;letter-spacing:.08em">{{ planTag }}</div></sc-if>
<div style="{{ blockStyle }}"><div style="{{ overStyle }}">{{ over }}</div><div style="font:700 36px/1.05 'Fredoka',sans-serif">{{ big }}</div><sc-if value="{{ bar }}" hint-placeholder-val="{{ false }}"><div style="display:flex;height:10px;margin-top:10px;border-radius:5px;overflow:hidden;background:#241f45"><div style="flex:9;background:#fff"></div><div style="flex:1"></div></div></sc-if><div style="font:500 14px/1.35 'Fredoka',sans-serif;margin-top:8px">{{ sub }}</div></div>
{{ children }}
<sc-if value="{{ showSigns }}" hint-placeholder-val="{{ true }}"><div style="height:48px;display:flex;align-items:center;justify-content:center;margin-top:6px;font:600 15px 'Fredoka',sans-serif;text-decoration:underline">{{ signsLabel }}</div></sc-if>
<sc-if value="{{ showActions }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:12px;align-items:center;margin-top:8px"><div style="flex:none;width:72px;height:72px;box-sizing:border-box;border-radius:50%;border:2.5px solid #241f45;display:flex;align-items:center;justify-content:center;font:600 14px 'Fredoka',sans-serif">{{ sideLabel }}</div><div style="{{ ctaStyle }}">{{ cta }}</div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:812},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;park&quot;,&quot;dont&quot;,&quot;soon&quot;,&quot;meter&quot;,&quot;nodata&quot;,&quot;planpark&quot;,&quot;plandont&quot;],&quot;default&quot;:&quot;park&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;street&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;E 1st St · North side&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cross&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Between 1st Ave and 2nd Ave&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;over&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Free to stay until&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;big&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mon 9:00 AM&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;signs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;signsLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;See the 2 signs on this curb&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;actions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Park here&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaKind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;raised&quot;,&quot;outline&quot;],&quot;default&quot;:&quot;raised&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;planTag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;TRIP PLAN · NOT LIVE · SAT 10 AM – SUN 6 PM&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const kind = p.kind ?? 'park';
    const B = { margin: '14px 0 0', padding: '16px 18px', borderRadius: 24 };
    const blocks = {
      park: { ...B, background: '#3ccf7a' },
      dont: { ...B, border: '3px dashed #e39a90', padding: '13px 15px' },
      soon: { ...B, border: '3px dashed #f2a23a', padding: '13px 15px' },
      meter: { ...B, border: '3px dotted #5b7cfa', padding: '13px 15px' },
      nodata: { ...B, border: '2px solid #a9a7b8', padding: '14px 16px' },
      planpark: { ...B, background: '#3ccf7a', boxShadow: '0 0 0 4px #fff, 0 0 0 7px #6a4cff' },
      plandont: { ...B, border: '3px dashed #e39a90', padding: '13px 15px' },
    };
    const overColor = { dont: '#b8322a', plandont: '#b8322a', nodata: '#5a5578' }[kind] ?? '#241f45';
    const raised = (p.ctaKind ?? 'raised') === 'raised';
    const ctaBase = { flex: 1, height: 72, boxSizing: 'border-box', borderRadius: 36, display: 'flex', alignItems: 'center', justifyContent: 'center', font: "700 24px 'Fredoka',sans-serif" };
    return {
      street: p.street ?? 'E 1st St · North side', cross: p.cross ?? 'Between 1st Ave and 2nd Ave',
      plan: kind.indexOf('plan') === 0, planTag: p.planTag ?? 'TRIP PLAN · NOT LIVE · SAT 10 AM – SUN 6 PM',
      blockStyle: blocks[kind], overStyle: { font: "500 15px 'Fredoka',sans-serif", color: overColor },
      over: p.over ?? 'Free to stay until', big: p.big ?? 'Mon 9:00 AM', sub: p.sub ?? '', bar: !!p.bar,
      showSigns: p.signs !== false, signsLabel: p.signsLabel ?? 'See the 2 signs on this curb',
      showActions: p.actions !== false && kind.indexOf('plan') !== 0,
      cta: p.cta ?? 'Park here', sideLabel: p.sideLabel ?? 'Report',
      ctaStyle: raised ? { ...ctaBase, background: '#ffd23f', border: '3px solid #241f45', boxShadow: '0 6px 0 #241f45', marginBottom: 6 } : { ...ctaBase, background: '#fff', border: '2.5px solid #241f45', font: "600 19px 'Fredoka',sans-serif" },
    };
  }
}
</script>
</body>
</html>
